<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星語塔羅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1014; --line:rgba(207,179,122,.26); --gold:#cfb37a; --gold2:#e8d7aa;
    --text:#e8e3d8; --body:#d4cec2; --muted:#8c877d;
    --serif:"Cormorant Garamond","Noto Serif TC","Songti TC","PMingLiU",serif;
    --zh:"Noto Serif TC","Songti TC","PMingLiU","Microsoft JhengHei",serif;
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0;min-height:100vh;color:var(--text);font-family:var(--zh);
    background:radial-gradient(120% 70% at 50% 0%,#1b1e25 0%,var(--bg) 62%);
    -webkit-font-smoothing:antialiased;overflow-x:hidden}
  main{max-width:960px;margin:0 auto;padding:56px 16px 72px;text-align:center}
  svg{display:block;width:100%;height:100%}

  /* 標頭 */
  .eyebrow{font-family:var(--serif);font-size:.78rem;letter-spacing:.45em;color:var(--muted);text-transform:uppercase;padding-left:.45em}
  h1{font-weight:400;font-size:2.6rem;letter-spacing:.45em;padding-left:.45em;margin:14px 0 0;color:var(--gold2)}
  .rule{display:flex;align-items:center;gap:14px;width:220px;margin:22px auto 0;color:var(--gold);font-size:.7rem}
  .rule::before,.rule::after{content:"";flex:1;height:1px;background:var(--line)}
  .steps{list-style:none;display:flex;justify-content:center;gap:30px;padding:0;margin:28px 0 48px;
    font-size:.82rem;letter-spacing:.2em;color:#5f5b53}
  .steps li{transition:color .4s}
  .steps li span{font-family:var(--serif);margin-right:6px}
  .steps li.on{color:var(--gold2)}

  .screen{display:none}
  .screen.active{display:block;animation:rise .8s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* 提問 */
  .ask{max-width:520px;margin:0 auto}
  .lead{color:var(--muted);line-height:2.1;margin:0 0 30px;font-size:.95rem}
  textarea{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--text);
    font:1.15rem/1.8 var(--zh);text-align:center;padding:10px 4px;resize:none;outline:none;transition:border-color .3s}
  textarea::placeholder{color:#57534c}
  textarea:focus{border-bottom-color:var(--gold)}
  .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:18px}
  .chip{background:none;border:1px solid rgba(207,179,122,.16);color:var(--muted);font:.8rem var(--zh);
    padding:6px 12px;border-radius:999px;cursor:pointer;transition:color .3s,border-color .3s}
  .chip:hover{color:var(--gold2);border-color:var(--gold)}
  .hint{min-height:1.5em;margin:16px 0 0;font-size:.88rem;color:var(--gold)}
  .btn{margin-top:22px;background:transparent;color:var(--gold2);border:1px solid var(--gold);
    padding:13px 42px 13px calc(42px + .4em);font:1rem var(--zh);letter-spacing:.4em;cursor:pointer;
    transition:background .3s,color .3s}
  .btn:hover{background:var(--gold);color:var(--bg)}

  /* 抽牌 */
  .qlabel{font-size:.75rem;letter-spacing:.35em;color:var(--muted);margin-bottom:10px}
  .q{font-size:1.15rem;color:var(--gold2);margin:0;line-height:1.8}
  .tip{color:var(--muted);font-size:.9rem;letter-spacing:.08em;min-height:1.6em;margin:22px 0 0}
  .fan{position:relative;width:100%;margin:8px auto 0;transition:height .6s ease,opacity .5s}
  .fan.gone{opacity:0}
  .pick{position:absolute;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .45s}
  .pick-inner{width:100%;height:100%;transition:transform .3s ease;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
  .fan.ready .pick{cursor:pointer}
  .fan.ready .pick:hover .pick-inner{transform:translateY(-16px)}
  .pick.taken{opacity:0;pointer-events:none}
  .pick.taken .pick-inner{transform:translateY(-50px)}
  .shuffling .pick:nth-child(odd) .pick-inner{animation:rl .55s ease-in-out 3}
  .shuffling .pick:nth-child(even) .pick-inner{animation:rr .55s ease-in-out 3}
  @keyframes rl{50%{transform:translateX(-46px) rotate(-5deg)}}
  @keyframes rr{50%{transform:translateX(46px) rotate(5deg)}}

  .slots{display:flex;justify-content:center;gap:clamp(12px,4vw,44px);margin-top:14px}
  .slot{width:min(160px,calc((100vw - 64px)/3))}
  .lab{font-family:var(--serif);font-size:.78rem;letter-spacing:.3em;color:var(--muted);margin-bottom:10px}
  .lab b{display:block;font-family:var(--zh);font-weight:400;font-size:.95rem;color:var(--gold2);margin-top:2px}
  .frame{aspect-ratio:200/340;border:1px dashed var(--line);border-radius:8px;perspective:1000px}
  .frame.filled{border-color:transparent}
  .flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.3,.7,.2,1);cursor:pointer;animation:land .5s ease}
  @keyframes land{from{opacity:0;transform:translateY(-30px)}}
  .flip.flipped{transform:rotateY(180deg);cursor:default}
  .side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;filter:drop-shadow(0 10px 18px rgba(0,0,0,.55))}
  .front{transform:rotateY(180deg)}
  .rev svg{transform:rotate(180deg)}
  .orient{margin-top:12px;font-size:.8rem;letter-spacing:.35em;color:var(--gold);min-height:1.3em}

  /* 解讀 */
  .readings{max-width:680px;margin:56px auto 0;text-align:left}
  .cat{text-align:center;font-size:.8rem;letter-spacing:.3em;color:var(--muted);margin-bottom:26px}
  .cat b{color:var(--gold2);font-weight:400}
  .reading{display:grid;grid-template-columns:84px 1fr;gap:26px;padding:34px 0;border-top:1px solid var(--line);animation:rise .9s ease both}
  .thumb{width:84px}
  .pos{font-family:var(--serif);font-size:.78rem;letter-spacing:.32em;color:var(--muted);text-transform:uppercase}
  .reading h3{font-weight:400;font-size:1.45rem;letter-spacing:.12em;margin:6px 0 6px;color:var(--gold2)}
  .en{font-family:var(--serif);font-style:italic;font-size:1rem;letter-spacing:.03em;color:var(--muted);margin-left:10px}
  .tag{font-size:.7rem;letter-spacing:.2em;border:1px solid var(--line);padding:2px 8px;margin-left:10px;vertical-align:middle;color:var(--gold)}
  .kw{font-size:.84rem;color:var(--muted);letter-spacing:.12em;margin-bottom:18px}
  .reading p,.summary p{line-height:2.05;margin:0 0 14px;font-size:.98rem;color:var(--body)}
  .reading p.story{color:#aea89c;border-left:1px solid var(--gold);padding-left:16px}
  .reading p.reflect{color:var(--gold2);font-size:.92rem;margin:0}
  .summary{border-top:1px solid var(--gold);padding:44px 0 8px;animation:rise .9s ease both}
  .summary h3{text-align:center;font-weight:400;font-size:1.35rem;letter-spacing:.4em;color:var(--gold2);margin:0 0 6px}
  .summary .sub{text-align:center;font-family:var(--serif);font-style:italic;color:var(--muted);margin-bottom:28px}
  .summary .advice{border:1px solid var(--line);padding:18px 22px;margin:22px 0}
  .summary .advice b{display:block;font-weight:400;font-size:.78rem;letter-spacing:.3em;color:var(--gold);margin-bottom:6px}
  .reading .inq{background:rgba(207,179,122,.06);padding:14px 18px;margin-top:4px}
  .reading .inq b,.sec-title{display:block;font-weight:400;font-size:.76rem;letter-spacing:.3em;color:var(--gold);margin-bottom:6px}
  .energy{font-size:.72rem;letter-spacing:.15em;color:var(--muted);margin-left:8px;vertical-align:middle}
  .verdict{border:1px solid var(--gold);padding:24px 26px;margin:6px 0 34px;text-align:center}
  .verdict .lvl{font-size:1.25rem;letter-spacing:.3em;color:var(--gold2);margin:8px 0 4px}
  .meter{display:flex;justify-content:center;gap:6px;margin:10px 0 14px}
  .meter i{width:30px;height:3px;background:rgba(207,179,122,.18)}
  .meter i.on{background:var(--gold)}
  .verdict p{margin:0!important;color:var(--text)!important;font-size:1.05rem!important}
  .sec{margin:0 0 30px}
  .why{list-style:none;padding:0;margin:0}
  .why li{padding:12px 0;border-bottom:1px solid rgba(207,179,122,.12);line-height:1.95;color:var(--body);font-size:.96rem}
  .why li b{display:block;font-weight:400;color:var(--gold2);font-size:.9rem;letter-spacing:.08em}
  .flow svg{width:100%;max-width:360px;height:auto;margin:6px auto 12px}
  .todo{padding-left:1.2em;margin:0;color:var(--body);line-height:2}
  .method{font-size:.8rem!important;color:var(--muted)!important;line-height:1.9!important;border-top:1px solid rgba(207,179,122,.12);padding-top:14px}
  .quote{text-align:center;color:var(--gold2)!important;font-size:1.05rem!important;margin:30px 0 0!important}
  .again{text-align:center}
  footer{margin-top:64px;font-size:.78rem;letter-spacing:.15em;color:#5f5b53}

  @media (max-width:560px){
    main{padding-top:40px}
    h1{font-size:2rem}
    .steps{gap:14px;font-size:.72rem;margin-bottom:36px}
    .reading{grid-template-columns:56px 1fr;gap:16px}
    .thumb{width:56px}
    .reading h3{font-size:1.25rem}
    .en{display:block;margin:2px 0 0}
    .tag{margin-left:0}
  }
</style>
</head>
<body>
<main>
  <div class="eyebrow">Star Whisper · Tarot</div>
  <h1>星語塔羅</h1>
  <div class="rule">✦</div>
  <ol class="steps" id="steps">
    <li class="on"><span>I</span>提問</li><li><span>II</span>抽牌</li><li><span>III</span>翻牌</li><li><span>IV</span>解讀</li>
  </ol>

  <section id="screen-ask" class="screen active">
    <div class="ask">
      <p class="lead">找一個安靜的片刻，深呼吸。<br>把心裡最在意的那件事，寫成一個問題。</p>
      <textarea id="question" rows="2" placeholder="寫下你的問題……"></textarea>
      <div class="chips" id="chips"></div>
      <div class="hint" id="ask-hint"></div>
      <button class="btn" id="btn-start">開始占卜</button>
    </div>
  </section>

  <section id="screen-draw" class="screen">
    <div class="qlabel">你的問題</div>
    <p class="q" id="q-show"></p>
    <p class="tip" id="tip"></p>
    <div class="fan" id="fan"></div>
    <div class="slots" id="slots"></div>
    <div class="readings" id="readings"></div>
  </section>

  <footer>塔羅是陪你整理心情的小工具，最終的答案，始終在你心裡。</footer>
</main>

<script>
/* ================= 色彩與繪圖工具 ================= */
const C={P:'#f3ead6',K:'#2b2420',Y:'#d9a441',Yl:'#f0dc9c',R:'#b0472f',B:'#45657e',Bl:'#b9ced2',G:'#7e9160',Gl:'#b9c58f',
  W:'#fbf7ee',Gr:'#9b948b',S:'#efd6b4',Br:'#9c6f45',N:'#2f3b52',Pu:'#7b5f86'};
const FONT='Cormorant Garamond, Noto Serif TC, serif';
const f=n=>+n.toFixed(1);
const H=(x,y,r=7)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${C.S}"/>`;
const BG=c=>`<rect x="18" y="48" width="164" height="236" fill="${c}" stroke="none"/>`;
function rays(x,y,r1,r2,n,col=C.K,w=1.3){let s='';for(let i=0;i<n;i++){const a=i*2*Math.PI/n;
  s+=`<line x1="${f(x+Math.cos(a)*r1)}" y1="${f(y+Math.sin(a)*r1)}" x2="${f(x+Math.cos(a)*r2)}" y2="${f(y+Math.sin(a)*r2)}" stroke="${col}" stroke-width="${w}"/>`;}return s;}
const SUN=(x,y,r,n=12)=>rays(x,y,r+3,r+10,n)+`<circle cx="${x}" cy="${y}" r="${r}" fill="${C.Y}"/>`;
function STAR(x,y,r,p=5,k=.45,fill=C.Y,rot=-90){const pts=[];for(let i=0;i<p*2;i++){const rr=i%2?r*k:r,a=(rot+i*180/p)*Math.PI/180;
  pts.push(f(x+Math.cos(a)*rr)+','+f(y+Math.sin(a)*rr));}return `<polygon points="${pts.join(' ')}" fill="${fill}"/>`;}
const INF=(x,y,w=11)=>`<path d="M${x} ${y} C${x-w*.4} ${y-w*.6} ${x-w} ${y-w*.6} ${x-w} ${y} C${x-w} ${y+w*.6} ${x-w*.4} ${y+w*.6} ${x} ${y} C${x+w*.4} ${y-w*.6} ${x+w} ${y-w*.6} ${x+w} ${y} C${x+w} ${y+w*.6} ${x+w*.4} ${y+w*.6} ${x} ${y}Z" fill="none" stroke-width="1.8"/>`;
function CLOUD(x,y,s=1){const c=[[-12,2,8],[0,-4,10],[12,2,8],[0,5,8]];
  return c.map(([a,b,r])=>`<circle cx="${x+a*s}" cy="${y+b*s}" r="${r*s}" fill="${C.W}"/>`).join('')+
         c.map(([a,b,r])=>`<circle cx="${x+a*s}" cy="${y+b*s}" r="${r*s-1}" fill="${C.W}" stroke="none"/>`).join('');}
const LIMB=(d,col,w=4)=>`<path d="${d}" fill="none" stroke="${C.K}" stroke-width="${w+2.2}"/><path d="${d}" fill="none" stroke="${col}" stroke-width="${w}"/>`;
function ROSE(x,y,r,col=C.W){let s='';for(let i=0;i<5;i++){const a=(i*72-90)*Math.PI/180;s+=`<circle cx="${f(x+Math.cos(a)*r*.6)}" cy="${f(y+Math.sin(a)*r*.6)}" r="${f(r*.55)}" fill="${col}"/>`;}
  return s+`<circle cx="${x}" cy="${y}" r="${f(r*.35)}" fill="${C.Y}"/>`;}
const TXT=(x,y,t,size=12,fill=C.K)=>`<text x="${x}" y="${y}" font-size="${size}" fill="${fill}" stroke="none" text-anchor="middle" font-family="${FONT}">${t}</text>`;
const mirror=s=>`<g transform="translate(200 0) scale(-1 1)">${s}</g>`;

/* ================= 22 張牌面插畫 ================= */
const SCENES=[
/* 0 愚者 */
BG(C.Yl)+SUN(150,78,13)+
`<path d="M18 205 L45 160 L62 182 L92 140 L122 186 L148 165 L182 200 L182 284 L18 284Z" fill="#dfe2d6"/>
<path d="M18 284 L18 236 Q80 222 140 236 L146 284Z" fill="#c9b07e"/>
<ellipse cx="62" cy="222" rx="11" ry="6" fill="${C.W}"/><circle cx="72" cy="213" r="5" fill="${C.W}"/>
<path d="M55 227 L52 236 M68 227 L70 236 M51 220 Q45 214 48 207" fill="none"/>`+
LIMB('M96 190 L92 233','#e9dcc0',3.5)+LIMB('M106 190 L116 230','#e9dcc0',3.5)+
`<path d="M86 140 Q100 134 114 140 L121 192 L79 192Z" fill="${C.R}"/>
<circle cx="94" cy="160" r="3" fill="${C.Y}"/><circle cx="106" cy="172" r="3" fill="${C.Y}"/><circle cx="96" cy="182" r="3" fill="${C.Y}"/>
<path d="M82 168 L118 168" stroke-width="2.4"/>
<line x1="84" y1="184" x2="132" y2="114" stroke="${C.Br}" stroke-width="2.6"/><circle cx="134" cy="110" r="8" fill="${C.Y}"/>`+
LIMB('M112 146 L104 154',C.S,3)+LIMB('M88 146 L73 160',C.S,3)+ROSE(70,162,5)+H(100,127,8)+
`<path d="M91 122 Q100 111 109 122Z" fill="${C.Y}"/><path d="M106 117 Q116 104 124 107 Q114 111 108 120Z" fill="${C.R}"/>`,

/* I 魔術師 */
BG(C.Yl)+[26,42,58,74,90,106,122,138,154,170].map((x,i)=>`<circle cx="${x}" cy="58" r="6" fill="${i%2?C.G:C.R}"/>`).join('')+
INF(100,78)+
`<path d="M80 110 Q100 104 120 110 L134 210 L66 210Z" fill="${C.R}"/><path d="M92 110 L108 110 L112 210 L88 210Z" fill="${C.W}"/>
<path d="M86 150 L114 150" stroke="${C.Y}" stroke-width="3"/>`+
LIMB('M110 116 L126 88',C.W,3.5)+`<line x1="124" y1="96" x2="132" y2="62" stroke="${C.K}" stroke-width="5"/><line x1="124" y1="96" x2="132" y2="62" stroke="${C.W}" stroke-width="2.6"/>`+
LIMB('M90 118 L72 150',C.W,3.5)+H(100,96,8)+`<path d="M92 92 L108 92" stroke="${C.W}" stroke-width="2"/>
<rect x="26" y="196" width="148" height="12" fill="#c49660"/><rect x="32" y="208" width="136" height="46" fill="#a87a4a"/>
<path d="M40 170 L60 170 Q60 184 50 184 Q40 184 40 170Z" fill="${C.Y}"/><path d="M50 184 L50 191 M44 196 L56 196 L50 190Z" fill="${C.Y}"/>
<circle cx="80" cy="189" r="7" fill="${C.Y}"/>`+STAR(80,189,5,5,.4,'none')+
`<line x1="104" y1="192" x2="148" y2="192" stroke="${C.K}" stroke-width="4.5"/><line x1="104" y1="192" x2="148" y2="192" stroke="#dcd8d0" stroke-width="2.4"/>
<line x1="110" y1="186" x2="110" y2="198" stroke="${C.Y}" stroke-width="3"/>
<line x1="152" y1="178" x2="168" y2="194" stroke="${C.Br}" stroke-width="3.4"/>
<rect x="18" y="254" width="164" height="30" fill="${C.Gl}"/>`+
[30,52,74,126,148,170].map((x,i)=>i%2?ROSE(x,268,7,C.R):ROSE(x,268,7)).join(''),

/* II 女祭司 */
BG('#d8ccb0')+`<rect x="18" y="262" width="164" height="22" fill="#c4b795"/>
<rect x="46" y="48" width="108" height="214" fill="#9fb084"/>`+
[[60,64],[84,74],[116,70],[140,62],[56,96],[144,96],[58,130],[142,132],[60,170],[142,168],[56,210],[144,212]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="4.5" fill="${C.R}"/>`).join('')+
`<rect x="20" y="62" width="24" height="200" fill="${C.K}"/><rect x="16" y="56" width="32" height="10" fill="${C.K}"/>
<rect x="156" y="62" width="24" height="200" fill="${C.W}"/><rect x="152" y="56" width="32" height="10" fill="${C.W}"/>`+
TXT(32,124,'B',16,'#fff')+TXT(168,124,'J',16,C.K)+
`<path d="M76 118 Q100 110 124 118 L142 262 L58 262Z" fill="${C.B}"/><path d="M95 118 L105 118 L108 200 L92 200Z" fill="${C.W}"/>
<path d="M100 128 L100 146 M93 136 L107 136"/>
<path d="M87 108 Q87 90 100 90 Q113 90 113 108 L115 124 L85 124Z" fill="${C.W}"/>`+H(100,104,8)+
`<circle cx="100" cy="80" r="5.5" fill="${C.W}"/><path d="M86 84 Q88 72 94 80 M114 84 Q112 72 106 80" fill="none" stroke-width="1.8"/>
<rect x="80" y="166" width="28" height="12" rx="5" fill="${C.W}" transform="rotate(-15 94 172)"/>
<path d="M66 276 Q100 252 134 276 Q100 266 66 276Z" fill="${C.Y}"/>`,

/* III 皇后 */
BG(C.Yl)+`<ellipse cx="34" cy="120" rx="13" ry="42" fill="#5d7048"/><ellipse cx="166" cy="116" rx="13" ry="44" fill="#5d7048"/><ellipse cx="150" cy="140" rx="11" ry="34" fill="#6f8457"/>
<path d="M24 150 L40 150 L46 242 L20 242Z" fill="${C.Bl}"/>
<rect x="56" y="122" width="88" height="112" rx="14" fill="${C.R}"/>
<path d="M74 114 Q100 106 126 114 L146 238 L54 238Z" fill="${C.W}"/>`+
[[86,140],[110,150],[92,176],[118,190],[80,210],[104,214],[128,222]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3" fill="${C.R}"/>`).join('')+
H(100,100,8)+`<path d="M92 98 Q90 112 86 118 M108 98 Q110 112 114 118" fill="none" stroke="${C.Y}" stroke-width="3"/>`+
[200,215,230,245,260,275,290,305,320,335].map(a=>{const r=a*Math.PI/180;return STAR(f(100+Math.cos(r)*17),f(98+Math.sin(r)*17),3,5,.45);}).join('')+
`<line x1="128" y1="154" x2="136" y2="106" stroke="${C.Y}" stroke-width="2.6"/><circle cx="137" cy="102" r="4.5" fill="${C.Y}"/>
<rect x="18" y="242" width="164" height="42" fill="#d8b45c"/>`+
Array.from({length:21},(_,i)=>{const x=22+i*8;return `<line x1="${x}" y1="284" x2="${x+2}" y2="252" stroke="#a5813a"/><ellipse cx="${x+2}" cy="250" rx="2.2" ry="5" fill="${C.Y}"/>`;}).join('')+
`<path d="M62 238 Q42 222 49 209 Q56 200 62 211 Q68 200 75 209 Q82 222 62 238Z" fill="#d9a79a"/>
<circle cx="62" cy="215" r="4" fill="none"/><path d="M62 219 L62 227 M58 223 L66 223"/>`,

/* IV 皇帝 */
BG('#e7a663')+`<path d="M18 230 L34 150 L52 180 L72 118 L92 168 L112 130 L134 176 L156 120 L182 190 L182 284 L18 284Z" fill="#b7643f"/>
<rect x="52" y="94" width="96" height="174" fill="#aaa398"/>
<circle cx="58" cy="100" r="9" fill="#cbc4b8"/><path d="M58 100 m-4 0 a4 4 0 1 1 4 4" fill="none"/>
<circle cx="142" cy="100" r="9" fill="#cbc4b8"/><path d="M142 100 m4 0 a4 4 0 1 0 -4 4" fill="none"/>

 cat:[['感情需要靜靜感受，你的直覺會告訴你答案。','安靜的環境最適合你，深度閱讀會有收穫。','先觀察、不急著表態，時機到了你自然知道。','理財上相信自己的判斷，低調穩健最好。','傾聽比說話更能拉近你們的距離。','答案其實已經在你心裡，給自己一段安靜的時間。'],
      ['也許有些心事還沒說開，溫柔地問一問吧。','別被焦慮淹沒，先深呼吸，再一步步來。','資訊還不夠清楚，先多了解再做決定。','不確定的事先暫緩，等看清楚再行動。','你可能壓抑了自己的感受，試著說出來。','最近有點忽略內心的聲音，記得停下來聽聽自己。']]},
{n:'皇后',en:'The Empress',num:'III',kw:['豐盛、滋養、溫柔','過度付出、忽略照顧自己'],

 mean:['皇后象徵豐盛、創造與無條件的愛。她代表你正處在一個能夠孕育美好的狀態——無論是一段關係、一項計畫，還是你自己，都正在慢慢開花結果。','逆位的皇后，像是把所有養分都給了別人，卻忘了澆灌自己。你可能付出太多而感到疲憊。請記得，照顧好自己，才有能力溫柔地照顧世界。'],

      ['愛別人之前，也記得好好愛自己。','休息不是偷懶，充好電才走得更遠。','別把所有事都扛在身上，學著請別人幫忙。','留意情緒性消費，你需要的可能是休息。','你付出很多，也值得被同樣溫柔地對待。','最近把自己放得太後面了，今天先照顧你自己。']]},
{n:'皇帝',en:'The Emperor',num:'IV',kw:['穩定、秩序、責任','控制、僵化、壓力'],

      ['放下一點掌控，讓對方也有空間靠近你。','計畫可以有彈性，不必對自己太嚴格。','壓力有點大，試著把標準放寬一點點。','不用把每一塊錢都算到緊繃，平衡最重要。','試著多聽聽別人的想法，關係會更柔軟。','你一直很努力撐著，偶爾放鬆也沒關係。']]},
{n:'教皇',en:'The Hierophant',num:'V',kw:['指引、學習、信任的支持','打破框架、尋找自己的路'],

{n:'戀人',en:'The Lovers',num:'VI',kw:['連結、選擇、和諧','猶豫、價值觀差異'],
 story:'天使在燦爛的太陽下張開雙翼，為下方的兩人送上祝福。兩人身後各有一棵樹——一棵燃著熱情的火焰，一棵結滿智慧的果實。他們站在花園裡，面對著一個關於心的選擇。',
 mean:['戀人牌不只關於愛情，更關於「發自內心的選擇」與真誠的連結。當你依循自己真正重視的價值做決定，關係與方向都會變得和諧。','逆位的戀人，像是兩個人站得很近，心卻還沒對齊。你可能在選擇之間猶豫，或在關係中感到價值觀的落差。坦誠溝通，是重新靠近的開始。'],
 ess:['一份心意相通、忠於自己的選擇','在兩條路之間猶豫的拉扯'],
 cat:[['心與心正在靠近，這是一段美好的連結。','選擇真正喜歡的方向，學習會充滿動力。','與夥伴合作順利，你們的默契很好。','共同規劃或合作，可能帶來好的結果。','你會遇到很合得來、能說心事的人。','跟隨你的心做選擇，它會帶你到對的地方。'],
      ['也許你們需要更多溝通，聊聊彼此真正的想法。','在選擇之間猶豫很正常，給自己一點時間。','合作中有些步調不一，坦白溝通會有幫助。','花錢前想想，它符合你真正重視的事嗎？','有些不同沒關係，尊重就能讓關係延續。','面對選擇有點糾結，先問問自己最在乎什麼。']]},
{n:'戰車',en:'The Chariot',num:'VII',kw:['前進、決心、勝利','方向不定、急躁、力不從心'],
 story:'一位身穿星辰鎧甲的戰士立於戰車之上，車前一黑一白兩隻人面獅身獸靜靜伏著。他沒有握著韁繩，單憑意志，就讓兩股相反的力量朝同一個方向前進。',
 mean:['戰車象徵決心、行動與突破。只要目標清楚、意志堅定，你就能駕馭內心的矛盾，穩穩地朝想要的方向前進。','逆位的戰車，像是兩隻獸各自往不同方向拉扯。你也許有些急躁，或對方向感到迷惘。停下來重新確認目標，比盲目加速更重要。'],
 ess:['目標清晰、一路向前的決心','想快卻使不上力的焦急'],
 cat:[['主動一點，你的心意會被好好接住。','保持衝勁，你很有機會達成目標。','全力以赴的你，正在往好的方向前進。','目標明確地存錢，會比想像中更快達成。','你的行動力會帶動身邊的人一起向前。','方向已經清楚，帶著決心勇敢前進吧。'],
      ['先別急著要結果，感情需要慢慢來。','衝太快有點累了吧？調整步伐不等於放棄。','方向有點模糊，停下來確認目標再出發。','避免衝動決定，慢一點反而更安全。','別太急著證明自己，關係需要時間。','有點用力過猛了，先休息一下再重新出發。']]},
{n:'力量',en:'Strength',num:'VIII',kw:['溫柔的力量、耐心、勇氣','自我懷疑、情緒疲憊'],
 story:'一位身著白衣的女子，溫柔地撫著獅子的頭，輕輕合上牠的嘴。她的頭頂浮著無限的符號，髮間與腰間繫著花環。她沒有用蠻力，卻讓猛獸甘心安靜下來。',
 mean:['力量牌告訴你，真正的強大是溫柔、耐心與包容。當你以溫和的方式面對內心的恐懼與外在的難題，它們會一點一點被馴服。','逆位的力量，像是女子一時懷疑自己能否安撫獅子。你可能感到情緒疲憊或自我懷疑。請記得，即使現在覺得脆弱，那份溫柔的力量從未離開你。'],
 ess:['以溫柔馴服恐懼的內在力量','有些疲憊、對自己失去信心的時刻'],
 cat:[['用耐心與溫柔，就能化解感情裡的不安。','穩穩地堅持，你的努力一定會有成果。','你的韌性很強，困難都能溫柔地跨過。','耐心等待，穩定累積會帶來回報。','你的包容讓別人願意對你敞開心。','你比你以為的更堅強，溫柔就是你的力量。'],
      ['不安的時候，記得你本來就值得被愛。','別因一次失誤否定自己，你已經很努力了。','情緒有點累了，允許自己慢下來。','對自己寬容一點，金錢的壓力會慢慢鬆開。','不需要一直忍耐，說出感受也是勇氣。','最近對自己有點懷疑，但你一直都很好。']]},
{n:'隱者',en:'The Hermit',num:'IX',kw:['沉澱、內省、尋找答案','孤單、封閉自己'],
 story:'一位披著灰色斗篷的老者獨自站在雪山之巔，一手拄著長杖，一手高舉燈籠，燈裡閃耀著一顆六芒星。他照亮的不只是自己腳下的路，也為後來的人指引方向。',
 mean:['隱者代表沉澱、內省與獨處中的智慧。這是一個適合放慢腳步、向內探索的時刻，你所尋找的答案，會在安靜中慢慢浮現。','逆位的隱者，提醒你獨處與孤立只有一線之隔。如果你把自己關得太久，不妨試著走下山，讓身邊的人陪你一起提燈。'],
 ess:['一段向內沉澱、尋找答案的安靜時光','把自己關得太久的孤單'],
 cat:[['先好好了解，自己想要什麼樣的愛。','獨處的時光，最適合專心學習。','靜下心思考，你會找到真正想走的方向。','簡單生活，你會發現自己需要的其實不多。','和少數知心朋友深聊，會讓你充飽電。','這是適合沉澱的時刻，答案會在安靜中浮現。'],
      ['別把自己關起來，你值得被靠近。','一個人卡住時，問問別人也很好。','有困難的話，試著向身邊的人求助。','財務煩惱別獨自承擔，找人聊聊會輕鬆些。','有點孤單的話，主動傳個訊息給朋友吧。','獨處很好，但也別忘了世界上有人在乎你。']]},
{n:'命運之輪',en:'Wheel of Fortune',num:'X',kw:['轉機、好運、順流','低潮、時機未到'],
 story:'巨大的命運之輪在雲端緩緩轉動，輪上刻著神秘的文字。四個角落的守護者靜靜注視，頂端的人面獅身獸穩坐不動——無論輪子如何轉，總有不變的智慧守在那裡。',
 mean:['命運之輪象徵轉機、循環與好運的到來。生命正在轉向新的階段，保持開放的心，你會發現機會比想像中更靠近。','逆位的命運之輪，像是輪子暫時轉到了低處。但請記得，轉動從不停止，低潮只是循環的一部分。耐心等待，風向一定會改變。'],
 ess:['一個正在轉動、悄悄靠近的轉機','暫時轉到低處、時機未到的等待'],
 cat:[['緣分的齒輪正在轉動，好事可能突然發生。','運氣站在你這邊，努力會遇上好時機。','轉機出現了，留意身邊的新機會。','財運有好轉的趨勢，把握合適的機會。','會有新的人進入你的生活，帶來好的改變。','生命正在轉向好的方向，相信這份流動。'],
      ['現在也許不是最好的時機，但不代表沒有可能。','暫時的低潮會過去，持續努力就好。','事情卡住只是暫時的，風向一定會改變。','這段時間保守一點，等待更好的時機。','關係起起伏伏很正常，別太責怪自己。','低潮是循環的一部分，天氣總會放晴。']]},
{n:'正義',en:'Justice',num:'XI',kw:['公平、真誠、平衡','失衡、委屈感'],
 story:'正義女神端坐於兩柱之間，右手高舉雙刃之劍，左手持著天秤。她的目光清澈而平靜，提醒世人：每一個選擇都有它的重量，也都會帶來相應的結果。',
 mean:['正義牌象徵公平、真誠與因果。你過去的努力與誠實，會在此時得到公正的回應；面對選擇時，依循你心中的價值，就不會走偏。','逆位的正義，像是天秤稍微傾斜了。你也許感到委屈或不公平，或是生活某些部分失去了平衡。試著誠實面對自己的感受，並溫柔地說出你的需要。'],
 ess:['誠實面對、問心無愧的清明','天秤傾斜、心中有些委屈的失衡'],
 cat:[['真誠與平等的付出，讓感情更長久。','你付出的努力，會得到應有的成果。','你的表現會被公正地看見。','收支平衡，清楚的規劃帶來安心。','誠實面對彼此，關係會更穩固。','依照你的價值做決定，你會對自己問心無愧。'],
      ['關係裡如果覺得不平衡，可以溫柔地提出來。','結果不如預期時，先別否定自己的努力。','覺得委屈的話，試著理性說出你的需求。','檢查一下收支，有些小地方需要調整。','試著站在對方角度想，也許會有新的理解。','生活有點失衡，慢慢找回自己的步調吧。']]},
{n:'吊人',en:'The Hanged Man',num:'XII',kw:['換個角度、等待、放下','停滯、不甘心、過度犧牲'],
 story:'一位男子倒吊在生命之樹上，雙手背在身後，神情卻出奇地平靜，頭頂甚至散發著光暈。他不是被懲罰，而是自願換一個角度，看見從未看過的世界。',
 mean:['吊人象徵暫停、換位思考與放下。有時候，停下來不是落後，而是讓你從新的角度理解事情，找到原本看不見的答案。','逆位的吊人，像是在樹上掛得太久，卻忘了為什麼而停。你可能在一件事上卡住、不甘心放手，或為別人犧牲太多。是時候溫柔地問問自己：這份等待還值得嗎？'],
 ess:['願意停下來、換個角度看世界的智慧','卡在原地、捨不得放手的停滯'],
 cat:[['換個角度看這段關係，你會看見新的可能。','卡關時換個方法，會突然豁然開朗。','暫時的等待，是為了更好的時機。','現在適合觀望，不急著做決定。','放下一點堅持，關係反而會更輕鬆。','暫停不是失敗，是讓你看見不同風景的機會。'],
      ['不必為了關係委屈自己，你的感受也很重要。','一直卡著時，先休息一下再回來看。','如果付出沒有被珍惜，可以重新思考方向。','別因為不甘心而繼續投入，適時停損也是智慧。','你不需要一直犧牲自己去配合別人。','有點卡住了，試著放下一些不屬於你的重擔。']]},
{n:'死神',en:'Death',num:'XIII',kw:['結束與新生、轉變','抗拒改變、捨不得'],
 story:'一面黑色旗幟在風中飄揚，旗上綻放著一朵白玫瑰。遠方兩座高塔之間，太陽正緩緩升起，河水靜靜流向遠方——結束與開始，原來一直並肩而行。',
 mean:['死神牌並不代表真正的死亡，而是「轉變」。一個階段正在結束，為的是讓更適合你的新開始有空間誕生，就像毛毛蟲必須告別繭，才能成為蝴蝶。','逆位的死神，像是緊緊抓著已經枯萎的花不肯放。改變讓人不安，這很正常；但當你願意鬆開手，就會發現新的陽光早已在地平線上等你。'],
 ess:['告別舊我、迎向新生的轉變','害怕改變、捨不得告別的不安'],
 cat:[['一個階段的結束，是為了迎接更適合的開始。','告別舊習慣，新的學習方式會更適合你。','改變正在發生，它會帶你走向新的階段。','整理舊的花費習慣，財務會煥然一新。','有些關係自然淡去，也會有新的緣分到來。','就像毛毛蟲變成蝴蝶，轉變會讓你更美好。'],
      ['捨不得放手很正常，給自己時間慢慢來。','舊方法不再有效時，可以試著做點改變。','害怕改變沒關係，一小步一小步就好。','有些習慣需要調整，不用一次到位。','慢慢接受關係的變化，你不需要強求。','改變讓人不安，但你已經準備得比想像中好。']]},
{n:'節制',en:'Temperance',num:'XIV',kw:['平衡、調和、耐心','失衡、過度、急躁'],
 story:'一位天使一腳踏在水中，一腳立於岸上，正將水在兩只杯子之間緩緩倒流，一滴也不灑出。遠方的小路蜿蜒通往山巔，山頂上懸著一圈金色的光。',
 mean:['節制牌象徵平衡、調和與耐心。它告訴你，不必急，也不必走極端；用剛剛好的節奏調和生活中的各種元素，你會走向一條平穩而美好的路。','逆位的節制，像是杯中的水開始溢出。你可能在某些地方用力過度，或生活步調失衡。試著深呼吸，把節奏調慢，讓身心回到中間的位置。'],
 ess:['不疾不徐、恰到好處的平衡','用力過猛、步調失衡的疲累'],
 cat:[['剛剛好的距離，讓感情溫和而長久。','讀書與休息取得平衡，效率最好。','協調與溝通，能讓工作順利進行。','收支平衡，細水長流最安心。','你是能讓大家和諧相處的人。','慢慢來，比較快。生活正在找到平衡。'],
      ['感情裡有點過度用力，試著放鬆一點。','熬夜硬撐，不如好好睡一覺。','事情太多了，記得把節奏調慢。','最近花費有點多，稍微收一收就好。','關係裡有點失衡，可以聊聊彼此的期待。','你最近有點累，先讓身心回到平衡吧。']]},
{n:'惡魔',en:'The Devil',num:'XV',kw:['執著、誘惑、被束縛','掙脫束縛、重獲自由'],
 story:'惡魔高坐在台座上，台前兩個人被鬆鬆的鎖鏈繫著。仔細看就會發現，那鎖鏈其實寬得可以自己取下——束縛他們的，往往是自己的執著與恐懼。',
 mean:['惡魔牌象徵執著、誘惑與自我設下的限制。它溫柔地提醒你看看：有沒有什麼習慣、關係或想法，正在悄悄綁住你？覺察，就是解開鎖鏈的第一步。','逆位的惡魔，是鎖鏈正在鬆開的時刻。你開始看見自己的束縛，也慢慢找回主導權。這份掙脫需要勇氣，而你已經在路上了。'],
 ess:['被某種執著悄悄牽絆的狀態','正在鬆開束縛、重獲自由的勇氣'],
 cat:[['留意自己是否太執著，愛應該讓人感到自由。','小心被手機或讓人分心的事情綁住了。','別讓工作壓力綁住你，你可以設下界線。','留意衝動消費的誘惑，記得你的目標。','讓你不舒服的關係，你有權利拉開距離。','有些東西讓你放不下，覺察它就是改變的開始。'],
      ['你正在放下讓你不快樂的執著。','擺脫壞習慣，你的專注力正在回來。','你開始找回主導權，不再被壓力牽著走。','戒掉不必要的花費，財務越來越自由。','你學會保護自己，這是很棒的成長。','束縛正在鬆開，你值得更輕盈的自己。']]},
{n:'高塔',en:'The Tower',num:'XVI',kw:['突然的變化、打破、看見真相','有驚無險、慢慢重建'],
 story:'一道閃電劈中了高聳的塔頂，金色的王冠被震落，火光從窗中竄出。看似崩毀的瞬間，卻也讓被困在塔裡的人，終於看見了外面真實的天空。',
 mean:['高塔象徵突如其來的改變與真相的揭露。它雖然令人震撼，卻是在推倒建立在不穩基礎上的東西，讓你有機會重建一個更真實、更堅固的自己。','逆位的高塔，代表風暴已經過去，或衝擊比想像中來得溫和。你正在從變動中慢慢站起，一磚一瓦地重建，而這一次會更加穩固。'],
 ess:['突然的震撼與看清真相的時刻','風暴過後、慢慢重建的復原'],
 cat:[['突然的變化也許讓人不安，但會讓真心浮現。','計畫被打亂沒關係，重新整理後會更穩固。','意外的變動，可能是重新開始的契機。','留意突發支出，準備一點緊急預備金。','一些真相浮上檯面，讓你看清誰是真正的朋友。','舊的倒下了，才有空間蓋起更好的。'],
      ['你們躲過了一場風暴，好好珍惜現在。','危機已經過去，慢慢把進度補回來就好。','變動的影響比想像中小，你能處理好的。','有驚無險，從中學到經驗就好。','關係正在修復中，給彼此一點時間。','最難的時候已經過去，你正在一點一點重建。']]},
{n:'星星',en:'The Star',num:'XVII',kw:['希望、療癒、願望','失去信心、暫時看不見光'],
 story:'夜空中閃耀著一顆巨大的八芒星，周圍環繞著七顆小星。一位女子跪在池畔，將一壺水倒回池中，另一壺灑向大地；樹梢上的小鳥輕聲歌唱——這是暴風雨後最寧靜的夜晚。',
 mean:['星星是希望與療癒之牌。它出現在高塔之後，告訴你最難的時候已經過去。請繼續相信你的願望，宇宙正溫柔地回應你。','逆位的星星，像是夜空暫時被雲層遮住。你也許覺得失去了方向或信心。但星星從未消失，它只是在等雲散開，等你再次抬頭。'],
 ess:['一份被溫柔照亮的希望','暫時看不見光、有些失落的心'],

/* ================= 能量判讀依據 =================
   依傳統牌義把 22 張牌分成：p 明亮、n 中性、c 考驗。
   正位：p=+2、n=+1、c=-1；逆位：p=0（稍弱）、n=-1（受阻）、c=+1（考驗緩和、回穩） */
const TONECLASS=['n','p','n','p','n','n','p','p','p','n','p','n','n','c','p','c','c','p','c','p','n','p'];
function score(d){const t=TONECLASS[d.id];return d.reversed?{p:0,n:-1,c:1}[t]:{p:2,n:1,c:-1}[t];}
function elabel(d){const s=score(d);if(d.reversed&&TONECLASS[d.id]==='c')return '回穩';return {2:'明亮',1:'平穩',0:'稍弱','-1':'考驗'}[s];}

  const fan=$('fan');fan.innerHTML='';fan.className='fan shuffling';fan.style.display='block';
  picks=deck.map(d=>{const el=document.createElement('div');el.className='pick';
    el.innerHTML=`<div class="pick-inner">${BACK}</div>`;el.onclick=()=>pickCard(d,el);fan.appendChild(el);return el;});
  layoutFan(false);
  $('slots').innerHTML=POS.map((p,i)=>`<div class="slot"><div class="lab">${p.roman}<b>${p.name}</b></div><div class="frame" id="slot-${i}"></div><div class="orient" id="orient-${i}"></div></div>`).join('');
  setTimeout(()=>{fan.classList.remove('shuffling');fanOpen=true;layoutFan(true);
    setTimeout(()=>{fan.classList.add('ready');$('tip').textContent='憑直覺選出三張牌，它們會依序放入「過去・現在・未來」';},700);},1800);
}

function layoutFan(open){
  const fan=$('fan'),W=fan.clientWidth,n=picks.length,small=W<560;
  const cw=small?44:66,ch=cw*1.7,maxA=small?38:30,rad=maxA*Math.PI/180;
  const R=Math.min(640,(W/2-cw/2-6)/Math.sin(rad));
  fan.style.height=(open?ch+R*(1-Math.cos(rad))+44:ch+44)+'px';
  picks.forEach((el,i)=>{
    const a=open?-maxA+2*maxA*i/(n-1):0;
    Object.assign(el.style,{width:cw+'px',height:ch+'px',left:(W/2-cw/2)+'px',top:'28px',
      transformOrigin:`50% ${R}px`,transitionDelay:open?(i*20)+'ms':'0ms',transform:`rotate(${a}deg)`});
  });
}
window.addEventListener('resize',()=>{if(picks.length)layoutFan(fanOpen);});

function pickCard(d,el){
  if(!$('fan').classList.contains('ready')||picked.length>=3)return;
  el.style.transitionDelay='0ms';el.classList.add('taken');
  const idx=picked.length;picked.push(d);
  const slot=$('slot-'+idx);slot.classList.add('filled');
  slot.innerHTML=`<div class="flip" id="flip-${idx}"><div class="side">${BACK}</div><div class="side front ${d.reversed?'rev':''}">${cardFace(d.id)}</div></div>`;
  $('flip-'+idx).onclick=()=>flipCard(idx);
  if(picked.length<3){$('tip').textContent=`已選 ${picked.length} 張，再選 ${3-picked.length} 張`;return;}
  const fan=$('fan');fan.classList.remove('ready');fan.classList.add('gone');
  setTimeout(()=>{fan.style.display='none';},500);
  setStep(2);$('tip').textContent='深呼吸，從「過去」開始，依序點擊牌卡翻開';
}

function flipCard(idx){
  if(picked.length<3)return;
  const f=$('flip-'+idx);if(f.classList.contains('flipped'))return;
  if(idx!==flipped){$('tip').textContent=`請先翻開「${POS[flipped].name}」的牌`;return;}
  f.classList.add('flipped');flipped++;
  $('orient-'+idx).textContent=picked[idx].reversed?'逆位':'正位';
  $('tip').textContent=flipped<3?`繼續翻開「${POS[flipped].name}」的牌`:'';
  setTimeout(()=>showReading(idx),800);
}

function showReading(idx){
  const d=picked[idx],c=CARDS[d.id],o=d.reversed?1:0,box=$('readings');
  if(idx===0){setStep(3);box.insertAdjacentHTML('beforeend',`<div class="cat">問題類型　<b>${CATS[category].name}</b></div>`);}
  box.insertAdjacentHTML('beforeend',`
    <article class="reading">
      <div class="thumb ${o?'rev':''}">${cardFace(d.id)}</div>
      <div>
        <div class="pos">${POS[idx].roman} · ${POS[idx].name}</div>
        <h3>${c.n}<span class="en">${c.en}</span><span class="tag">${o?'逆位':'正位'}</span><span class="energy">能量・${elabel(d)}</span></h3>
        <div class="kw">關鍵字：${c.kw[o]}</div>
        <p class="story">${c.story}</p>
        <p>${c.mean[o]}</p>
        <div class="inq"><b>放在你的問題裡</b>${PREFIX[idx]}${SIT[d.id][o]}。${c.cat[o][CAT_INDEX[category]]}</div>
      </div>
    </article>`);
  box.lastElementChild.scrollIntoView({behavior:'smooth',block:'start'});
  if(idx===2)setTimeout(showSummary,1400);
}

function showSummary(){
  const ci=CAT_INDEX[category],sc=picked.map(score),[sp,sn,sf]=sc;
  const total=sp*.5+sn*1+sf*1.5;
  const lvl=total>=3.5?0:total>=1.5?1:total>=-.5?2:3;
  const quote=QUOTES[Math.floor(Math.random()*QUOTES.length)];
  const why=picked.map((d,i)=>{const c=CARDS[d.id],o=d.reversed?1:0;
    return `<li><b>${POS[i].roman}・${POS[i].name}｜${c.n}・${o?'逆位':'正位'}（能量${elabel(d)}）</b>${PREFIX[i]}${SIT[d.id][o]}。</li>`;}).join('');
  const t1=sn>sp?'比起過去，你現在的狀態已經好轉了，代表你一路的調整是有用的。':sn<sp?'比起過去，現在的你可能辛苦一些，這是正常的起伏，不代表走錯路。':'從過去到現在，狀況大致延續，你一直用相似的方式面對這件事。';
  const t2=sf>sn?'而從現在到未來，能量是往上走的——眼前的狀況會慢慢好轉。':sf<sn?(sf>0?'未來牌的能量比現在略低，但仍是正向的，提醒你別因為現在順利就鬆懈。':'未來牌的能量比現在低一些，這不是壞消息，而是提前提醒你：接下來需要多一點耐心與準備。'):(sf>0?'現在到未來的能量都很穩定，維持目前的方向就好。':'現在到未來的能量偏低而平穩，表示這件事需要時間，不會一下子改變。');
  const Y=s=>70-(s+1)*16.7, X=[50,180,310];
  const pts=sc.map((s,i)=>`${X[i]},${f(Y(s))}`).join(' ');
  const chart=`<svg viewBox="0 0 360 104" role="img" aria-label="能量走勢">
    <line x1="30" y1="${f(Y(0))}" x2="330" y2="${f(Y(0))}" stroke="rgba(207,179,122,.18)" stroke-dasharray="3 4"/>
    <polyline points="${pts}" fill="none" stroke="#cfb37a" stroke-width="1.6"/>
    ${sc.map((s,i)=>`<circle cx="${X[i]}" cy="${f(Y(s))}" r="4.5" fill="#0e1014" stroke="#e8d7aa" stroke-width="1.6"/>
      <text x="${X[i]}" y="98" text-anchor="middle" font-size="12" fill="#8c877d" font-family="Noto Serif TC,serif" letter-spacing="2">${POS[i].name}・${elabel(picked[i])}</text>`).join('')}
  </svg>`;
  const todo=[...new Set([CARDS[picked[2].id].cat[picked[2].reversed?1:0][ci],CARDS[picked[1].id].cat[picked[1].reversed?1:0][ci]])];
  $('readings').insertAdjacentHTML('beforeend',`
    <section class="summary">
      <h3>綜合解讀</h3>
      <div class="sub">a reading for you</div>
      <div class="verdict">
        <span class="sec-title">關於「${esc(question)}」</span>
        <div class="meter">${[3,2,1,0].map(k=>`<i class="${k>=lvl?'on':''}"></i>`).join('')}</div>
        <div class="lvl">${LEVELS[lvl]}</div>
        <p>${VERDICT[category][lvl]}</p>
      </div>
      <div class="sec"><span class="sec-title">為什麼這樣說</span><ul class="why">${why}</ul></div>
      <div class="sec flow"><span class="sec-title">三張牌的能量走勢</span>${chart}<p>${t1}${t2}</p></div>
      <div class="sec"><span class="sec-title">你可以這樣做</span><ol class="todo">${todo.map(t=>`<li>${t}</li>`).join('')}</ol></div>
      <p class="method">判讀方式：每張牌依傳統牌義分為明亮、中性、考驗三類，再依正逆位調整能量（例如高塔正位是考驗，逆位則代表風暴過後的回穩）。三個位置中，「未來」牌影響最大、「現在」次之、「過去」最小，綜合後得出上方的傾向。塔羅提供的是看事情的角度，而不是注定的結果。</p>
      <p class="quote">「${quote}」</p>
      <div class="again"><button class="btn" id="btn-again">再占卜一次</button></div>
    </section>`);
  $('btn-again').onclick=()=>{
    $('screen-draw').classList.remove('active');$('screen-ask').classList.add('active');
    $('question').value='';picks=[];setStep(0);window.scrollTo({top:0,behavior:'smooth'});
  };
  $('readings').lastElementChild.scrollIntoView({behavior:'smooth',block:'start'});
}
</script>
</body>
</html>
